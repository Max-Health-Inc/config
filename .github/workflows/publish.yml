name: Publish to GitHub Packages

# Publishes on merge to main; a version already on the registry is a no-op, so bump the
# version in your PR to release. The scope must stay @max-health-inc, because a GitHub
# Packages scope resolves to the owner hosting it.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      scope: '@max-health-inc'
      runtime: bun
      check-steps: "test"
      install: bun install
      tag-release: true
      create-release: true
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
